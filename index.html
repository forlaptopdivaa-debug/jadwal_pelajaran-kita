<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jadwal Pelajaranku</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #fff0f5;
      color: #633b4d;
      margin: 0;
      padding: 20px;
    }

    header {
      text-align: center;
      padding: 20px;
    }

    header h1 {
      color: #d85f91;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    .form-box, .jadwal-box, .login-box {
      background: white;
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 20px;
      box-shadow: 0 4px 12px #eac6d5;
    }

    .login-box {
      max-width: 430px;
      margin: 35px auto;
    }

    .login-box h1 {
      text-align: center;
      color: #d85f91;
    }

    input, select, button {
      width: 100%;
      padding: 12px;
      margin: 6px 0;
      border-radius: 9px;
      border: 1px solid #edb7ce;
      font-size: 15px;
    }

    button {
      background: #e98bb2;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #d96d9a;
    }

    .hari {
      background: #fff7fa;
      padding: 12px;
      border-radius: 10px;
      margin: 10px 0;
    }

    .hari h3 {
      color: #d85f91;
      margin-top: 0;
    }

    .pelajaran {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 8px;
      border-bottom: 1px solid #f7dce7;
    }

    .hapus {
      width: auto;
      padding: 7px 10px;
      background: #d96d79;
      flex-shrink: 0;
    }

    .kosong {
      color: #ad8495;
      font-size: 14px;
    }

    .catatan {
      font-size: 13px;
      line-height: 1.5;
      color: #ad6687;
      text-align: center;
    }

    #pesanLogin {
      color: #c03965;
      font-size: 14px;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>

  <!-- HALAMAN LOGIN -->
  <main id="halamanLogin" class="login-box">
    <h1>🎀 Selamat Datang!</h1>

    <p style="text-align:center;">
      login dulu sebelum pake web ini ya
    </p>

    <form id="formLogin">
      <label for="namaLogin">Nama</label>
      <input
        id="namaLogin"
        type="text"
        placeholder="Masukkan nama"
        autocomplete="username"
        required
      >

      <label for="passwordLogin">Pasword</label>
      <input
        id="passwordLogin"
        type="password"
        placeholder="Masukkan pasword"
        autocomplete="current-password"
        required
      >

      <button type="submit">Masuk ✨</button>

      <p id="pesanLogin" role="status"></p>
    </form>

    <p class="catatan">
      Pastikan teman² gunakan nama atau pasword
      yang sama ya saat membukanya
    </p>
  </main>

  <!-- HALAMAN JADWAL PELAJARAN -->
  <div id="halamanJadwal" hidden>

    <header>
      <h1>🎀 Jadwal Pelajaranku</h1>
      <p>Belajar teratur, raih cita-citamu!</p>
      <p id="sapaan"></p>
      <button onclick="keluar()">Keluar</button>
    </header>

    <main class="container">

      <section class="form-box">
        <h2>Tambah Pelajaran ✏️</h2>

        <select id="hari">
          <option value="Senin">Senin</option>
          <option value="Selasa">Selasa</option>
          <option value="Rabu">Rabu</option>
          <option value="Kamis">Kamis</option>
          <option value="Jumat">Jumat</option>
        </select>

        <input
          id="jam"
          type="text"
          placeholder="Jam, contoh: 07.00 - 08.30"
        >

        <input
          id="mapel"
          type="text"
          placeholder="Nama mata pelajaran"
        >

        <button onclick="tambahJadwal()">
          + Tambah Jadwal
        </button>
      </section>

      <section class="jadwal-box">
        <h2>📚 Jadwal Mingguan</h2>
        <div id="daftarJadwal"></div>
      </section>

    </main>
  </div>

  <script>
    const hariList = [
      "Senin", "Selasa", "Rabu", "Kamis", "Jumat"
    ];

    let namaAktif = "";
    let kunciJadwal = "";
    let jadwal = [];

    // LOGIN DAN PENDAFTARAN OTOMATIS
    document.getElementById("formLogin")
      .addEventListener("submit", function(event) {
        event.preventDefault();

        const nama = document.getElementById("namaLogin")
          .value.trim();

        const password = document.getElementById("passwordLogin")
          .value;

        const pesan = document.getElementById("pesanLogin");

        if (!nama || !password) {
          pesan.textContent = "Isi nama dan pasword dulu ya!";
          return;
        }

        const namaKunci = nama.toLowerCase();
        const kunciAkun = "akunJadwal_" + namaKunci;

        let akun = localStorage.getItem(kunciAkun);

        if (akun === null) {
          // Nama baru akan membuat akun di browser ini.
          akun = JSON.stringify({
            nama: nama,
            password: password
          });

          localStorage.setItem(kunciAkun, akun);
        } else {
          const dataAkun = JSON.parse(akun);

          if (dataAkun.password !== password) {
            pesan.textContent =
              "Nama atau pasword salah. Coba lagi ya!";
            return;
          }
        }

        namaAktif = nama;
        kunciJadwal = "jadwalPelajaran_" + namaKunci;

        jadwal = JSON.parse(
          localStorage.getItem(kunciJadwal) || "[]"
        );

        document.getElementById("halamanLogin").hidden = true;
        document.getElementById("halamanJadwal").hidden = false;

        document.getElementById("sapaan").textContent =
          "Halo, " + namaAktif + "! Selamat belajar 💗";

        tampilkanJadwal();
      });

    // SIMPAN JADWAL KHUSUS AKUN YANG SEDANG LOGIN
    function simpan() {
      localStorage.setItem(
        kunciJadwal,
        JSON.stringify(jadwal)
      );
    }

    // TAMBAH JADWAL
    function tambahJadwal() {
      const hari = document.getElementById("hari").value;
      const jam = document.getElementById("jam").value.trim();
      const mapel = document.getElementById("mapel").value.trim();

      if (!jam || !mapel) {
        alert("Isi jam dan mata pelajaran dulu ya!");
        return;
      }

      jadwal.push({
        id: Date.now() + Math.random(),
        hari: hari,
        jam: jam,
        mapel: mapel
      });

      simpan();
      tampilkanJadwal();

      document.getElementById("jam").value = "";
      document.getElementById("mapel").value = "";
    }

    // HAPUS JADWAL
    function hapusJadwal(id) {
      jadwal = jadwal.filter(item => item.id !== id);
      simpan();
      tampilkanJadwal();
    }

    // TAMPILKAN JADWAL
    function tampilkanJadwal() {
      const daftar = document.getElementById("daftarJadwal");
      daftar.replaceChildren();

      hariList.forEach(hari => {
        const bagian = document.createElement("div");
        bagian.className = "hari";

        const judul = document.createElement("h3");
        judul.textContent = "🌸 " + hari;
        bagian.appendChild(judul);

        const dataHari = jadwal
          .filter(item => item.hari === hari)
          .sort((a, b) => a.jam.localeCompare(b.jam));

        if (dataHari.length === 0) {
          const kosong = document.createElement("p");
          kosong.className = "kosong";
          kosong.textContent = "Belum ada pelajaran.";
          bagian.appendChild(kosong);
        }

        dataHari.forEach(item => {
          const baris = document.createElement("div");
          baris.className = "pelajaran";

          const info = document.createElement("span");
          info.textContent = item.jam + " | " + item.mapel;

          const tombol = document.createElement("button");
          tombol.className = "hapus";
          tombol.textContent = "Hapus";
          tombol.onclick = () => hapusJadwal(item.id);

          baris.append(info, tombol);
          bagian.appendChild(baris);
        });

        daftar.appendChild(bagian);
      });
    }

    // KELUAR DARI AKUN
    function keluar() {
      namaAktif = "";
      kunciJadwal = "";
      jadwal = [];

      document.getElementById("formLogin").reset();
      document.getElementById("pesanLogin").textContent = "";

      document.getElementById("halamanJadwal").hidden = true;
      document.getElementById("halamanLogin").hidden = false;
    }
  </script>

</body>
</html>
